version: 2

models:
  - name: stg_transactions_xtb
    description: "XTB (Portugal) stock purchases and sales. Only 'Stock purchase' and 'Stock sale' rows are kept and the 'Total' summary row is dropped. Shares and price are parsed from the free-text comment, and shares and amount are signed so purchases are positive and sales negative."
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

  - name: stg_asset_prices
    description: "Daily asset prices (open, high, low, close, adjusted close and volume) from Yahoo Finance, with asset codes and currencies upper-cased and trimmed"
    columns:
      - name: price_date
        tests:
          - not_null
      - name: asset_code
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - asset_code
            - price_date

  - name: stg_exchange_rates
    description: "Daily currency exchange rates, one row per currency pair and date"
    columns:
      - name: rate_date
        tests:
          - not_null
      - name: currency_from
        tests:
          - not_null
      - name: currency_to
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - currency_from
            - currency_to
            - rate_date

  - name: stg_asset
    description: "List of assets held, built from XTB symbols (Portugal), B3 equity positions and B3 bond positions (Brazil)"
    columns:
      - name: asset_code
        tests:
         - unique
         - not_null

  - name: stg_asset_mapping
    description: "Manually maintained asset reference from the raw_asset_mapping seed, linking each asset code to its class and its ticker in the price source"
    columns:
      - name: asset_code
        tests:
          - unique
          - not_null

  - name: stg_asset_details
    description: "Descriptive asset information (name, sector, industry, exchange, currency) with text fields trimmed. Country is set from the exchange for LSE (England), GER (Germany) and AMS (Netherlands)"
    columns:
      - name: asset_code
        tests:
          - unique
          - not_null

  - name: stg_trades_b3
    description: "Running B3 position after each trade: one row per trade with the shares held, cost basis and average cost once that trade is applied. Combines B3 trades with the corporate action seed rows flagged APPLY_IN_MODEL = 'Y'. Asset codes have the fractional-market 'F' suffix removed and renamed tickers mapped to their current code. Cost basis uses average cost: purchases and adjustments add their amount, while sales and write-offs remove cost at the current average price."
    columns:
      - name: trade_key
        tests:
          - unique
          - not_null
      - name: trade_date
        tests:
          - not_null
      - name: asset_code
        tests:
          - not_null
      - name: shares_held
        tests:
          - not_null
      - name: cost_basis_in_brl
        tests:
          - not_null
      - name: avg_cost_price
        tests:
          - not_null

  - name: stg_asset_conversion_mapping
    description: "Maps old or renamed tickers to their current asset code (e.g. VVAR3 -> BHIA3)"

  - name: stg_positions_equities_b3
    description: "B3 equity position snapshot. Asset codes have the fractional-market 'F' suffix removed and renamed tickers mapped to their current code"

  - name: stg_positions_bonds_b3
    description: "B3 fixed income (bond) position snapshot"

  - name: stg_transaction_type
    description: "Standardized transaction types from the raw_transaction_type_seed, with flags for how each type affects the portfolio"
