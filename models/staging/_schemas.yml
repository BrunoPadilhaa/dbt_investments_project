version: 2

models:
  - name: stg_transactions_xtb
    description: "Cleaned Portuguese trades data"
    columns:
      - name: transaction_id
        description: "Unique identifier for each trade"
        tests:
          - unique
          - not_null
    
  - name: stg_asset_prices
    description: "Cleaned daily stock prices"
    columns:
      - name: asset_code
        description: "Stock symbol"
        tests:
          - not_null
      - name: price_date
        description: "Date of the stock price"
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - asset_code
            - price_date

  - name: stg_exchange_rates
    description: "Cleaned daily exchange rates"
    columns:
      - name: currency_from
        description: "Base currency being converted from"
        tests:
          - not_null
      - name: currency_to
        description: "Target currency being converted to"
        tests:
          - not_null
      - name: rate_date
        description: "Date of the exchange rate"
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - currency_from
            - currency_to
            - rate_date

  - name: stg_asset
    description: "Cleaned asset information"
    columns:
      - name: asset_code
        description: "Asset code"
        tests:
         - unique
         - not_null

  - name: stg_asset_mapping
    description: "Cleaned asset mapping data"
    columns:
      - name: asset_code
        description: "Asset code"
        tests:
          - unique 
          - not_null

  - name: stg_asset_details
    description: "Cleaned asset details data"
    columns:
      - name: asset_code
        description: "Asset code"
        tests:
          - unique 
          - not_null

  - name: stg_trades_b3
    description: "Cleaned B3 trades data"
    columns:
      - name: trade_key
        description: "Unique identifier for each trade"
        tests:
          - unique
          - not_null
      - name: trade_date
        description: "Date of the trade"
        tests:
          - not_null
      - name: asset_code
        description: "Asset code"
        tests:
          - not_null
      - name: shares_held
        description: "Number of shares held after the trade"
        tests:
          - not_null
      - name: cost_basis_in_brl
        description: "Cost basis in BRL after the trade"
        tests:
          - not_null
      - name: avg_cost_price
        description: "Average cost price per share in BRL after the trade"
        tests:
          - not_null
